<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>My To-Do List</h1>
            <p>Manage your daily tasks efficiently</p>
        </div>
        <button id="themeBtn">🌙</button>
    </div>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Enter your task...">

        <select id="priority">
            <option value="Low">Low Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="High">High Priority</option>
        </select>

        <input type="date" id="dueDate">

        <button id="addBtn">Add Task</button>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Search tasks...">

    <div class="stats">
        <span>Total: <b id="totalTasks">0</b></span>
        <span>Completed: <b id="completedTasks">0</b></span>
        <span>Pending: <b id="pendingTasks">0</b></span>
    </div>

    <h3>Progress</h3>
    <div class="progress">
        <div id="progressBar"></div>
    </div>
    <p id="progressText">0% Completed</p>

    <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="pending">Pending</button>
        <button class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <button id="clearBtn">Clear All Tasks</button>
</div>

<script src="script.js"></script>
</body>
</html>
